; Roger firmware. One codebase, one environment per board.
;
;   pio run -e m5sticks3 -t upload      # M5Stack StickS3 (no soldering)
;   pio run -e xiao_diy  -t upload      # Seeed XIAO ESP32S3 + INMP441 + MAX98357A
;
; Copy include/config.example.h to include/config.h first.
;
; The platform and libraries are pinned to GitHub release URLs and tags so a
; build today and a build next year fetch the same code.

[platformio]
default_envs = m5sticks3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DROGER_FW_VERSION=\"0.1.0\"
    -Wall

[common]
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/Links2004/arduinoWebSockets.git#2.7.2

; --- M5Stack StickS3: ESP32-S3-PICO-1-N8R8, ES8311 codec, built-in mic,
;     speaker, battery and buttons. Nothing to wire.
[env:m5sticks3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DROGER_BOARD_M5STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps}
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0

; --- DIY: Seeed XIAO ESP32S3 with an INMP441 microphone and MAX98357A
;     amplifier. See hardware/wiring for the pin map.
[env:xiao_diy]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DROGER_BOARD_XIAO_DIY
lib_deps =
    ${common.lib_deps}
